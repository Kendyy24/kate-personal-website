    <!-- IMAGE VIEWER (NO EXIT BUTTON) -->
    <div class="image-viewer" id="imageViewer" aria-hidden="true">
        <img id="viewerImage" src="" alt="Expanded gallery image">
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const galleryImages = document.querySelectorAll(".gallery-image img");
        const imageViewer = document.getElementById("imageViewer");
        const viewerImage = document.getElementById("viewerImage");

        function openViewer(image) {
            viewerImage.src = image.src;
            viewerImage.alt = image.alt;

            imageViewer.classList.add("is-open");
            imageViewer.setAttribute("aria-hidden", "false");

            document.body.style.overflow = "hidden";
        }

        function closeViewer() {
            imageViewer.classList.remove("is-open");
            imageViewer.setAttribute("aria-hidden", "true");

            viewerImage.src = "";
            document.body.style.overflow = "";
        }

        // OPEN IMAGE WHEN HOVERED OR CLICKED
        galleryImages.forEach(image => {

            image.addEventListener("mouseenter", () => {
                openViewer(image);
            });

            image.addEventListener("click", () => {
                openViewer(image);
            });

            // Keyboard support
            image.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openViewer(image);
                }
            });

        });

        // CLOSE WHEN CLICKING THE DARK BACKGROUND
        imageViewer.addEventListener("click", event => {
            if (event.target === imageViewer) {
                closeViewer();
            }
        });

        // CLOSE USING ESCAPE KEY
        document.addEventListener("keydown", event => {
            if (
                event.key === "Escape" &&
                imageViewer.classList.contains("is-open")
            ) {
                closeViewer();
            }
        });
    </script>
